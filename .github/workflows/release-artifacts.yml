name: release-artifacts

# Reusable: cross-compiles the release binaries for a tag, packages them, and
# attaches them to that tag's GitHub release (creating the release if it does
# not exist yet). Called by release-please.yml and by release.yml.

on:
  workflow_call:
    inputs:
      tag:
        description: Tag to build and publish, e.g. v1.2.3
        required: true
        type: string

permissions:
  contents: write

jobs:
  publish:
    name: build and publish ${{ inputs.tag }}
    runs-on: ubuntu-latest
    steps:
      - name: Validate tag
        run: |
          case '${{ inputs.tag }}' in
            v*) ;;
            *) echo "::error::tag must start with 'v', got '${{ inputs.tag }}'"; exit 1 ;;
          esac

      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag }}

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Test
        run: go test ./...

      - name: Cross-compile binaries
        run: make dist VERSION='${{ inputs.tag }}'

      - name: Package archives and checksums
        working-directory: dist
        env:
          VERSION: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          for bin in agent-web-manager-*; do
            target="${bin#agent-web-manager-}"           # e.g. darwin-arm64
            stage="stage/agent-web-manager_${VERSION}_${target}"
            mkdir -p "$stage"
            cp "$bin" "$stage/agent-web-manager"
            chmod +x "$stage/agent-web-manager"
            cp ../README.md "$stage/"
            tar -czf "agent-web-manager_${VERSION}_${target}.tar.gz" -C stage "$(basename "$stage")"
            rm -rf "$stage"
          done
          rm -rf stage
          sha256sum ./*.tar.gz > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Attach artifacts to the release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          if gh release view "$VERSION" >/dev/null 2>&1; then
            gh release upload "$VERSION" dist/*.tar.gz dist/SHA256SUMS.txt --clobber
          else
            gh release create "$VERSION" dist/*.tar.gz dist/SHA256SUMS.txt \
              --title "$VERSION" --generate-notes
          fi
